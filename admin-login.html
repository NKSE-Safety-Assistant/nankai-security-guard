<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台登录 | 南开校园安全卫士</title>
    <link rel="icon" type="image/png" href="assets/nankai-security-logo.png" />
    <link rel="stylesheet" href="staff-login.css?v=20261117-single-column-large" />
  </head>
  <body class="admin-login-page staff-login-page">
    <main class="admin-login-shell">
      <header class="admin-login-brand"><img src="assets/nankai-security-logo.png" alt="" aria-hidden="true" /><div><strong>南开校园安全卫士</strong><small>Nankai Safety Assistant</small></div></header>
      <section class="admin-login-card" aria-labelledby="loginTitle">
        <section class="admin-login-panel">
          <div class="admin-login-heading"><h1 id="loginTitle">工作人员登录</h1><p>请选择工作身份，使用已授权的账号登录。</p></div>
          <nav class="login-role-switch" aria-label="选择工作人员登录身份">
            <a href="/admin-login.html?role=admin&amp;next=%2Fadmin.html" data-login-role="admin">管理员</a>
            <a href="/admin-login.html?role=editor&amp;next=%2Feditor.html" data-login-role="editor">编辑员</a>
            <a href="/admin-login.html?role=reviewer&amp;next=%2Freviewer.html" data-login-role="reviewer">审核员</a>
          </nav>
          <p id="rolePurpose" class="login-role-purpose"></p>
          <form id="adminLoginForm" class="admin-login-form" autocomplete="off">
            <label><span id="usernameLabel">账号</span><input id="loginUsername" name="loginUsername" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="后台账号" readonly required /></label>
            <label><span id="passwordLabel">密码</span><input id="loginPassword" name="loginPassword" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore placeholder="登录密码" readonly required /></label>
            <button class="admin-login-submit" type="submit">登录后台</button>
            <p id="loginMessage" role="status"></p>
          </form>
          <div class="admin-login-divider"><span>其他登录方式</span></div>
          <a id="feishuLoginLink" class="admin-login-feishu" href="/api/auth/login?role=admin">飞书授权登录</a>
        </section>
      </section>
      <footer class="login-footer"><p class="admin-login-tip">仅限已授权的工作人员使用</p><a class="admin-login-back" href="knowledge.html">返回学生学习平台</a></footer>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const workspaces = { admin: "/admin.html", editor: "/editor.html", reviewer: "/reviewer.html" };
      const requestedRole = params.get("role") || Object.keys(workspaces).find((key) => workspaces[key] === params.get("next"));
      const role = Object.hasOwn(workspaces, requestedRole) ? requestedRole : "admin";
      const next = workspaces[role];
      const accountText = { admin: "管理员账号", reviewer: "审核员账号", editor: "编辑员账号" };
      const titleText = { admin: "管理员登录", reviewer: "审核员登录", editor: "编辑员登录" };
      const message = document.querySelector("#loginMessage");
      const roleBriefs = {
        admin: '学习任务 · 题库维护 · 学习统计 · 角色管理',
        editor: '来源核对 · 材料脱敏 · 情景编写 · 提交审核',
        reviewer: '内容核验 · 审核发布 · 退回修改'
      };
      document.querySelector('#rolePurpose').textContent = roleBriefs[role] || roleBriefs.admin;
      const isGithubPages = location.hostname.endsWith(".github.io");
      document.title = (titleText[role] || "后台登录") + " | 南开校园安全卫士";
      document.querySelector("#loginTitle").textContent = titleText[role] || "工作人员登录";
      document.querySelector("#usernameLabel").textContent = accountText[role] || "后台账号";
      document.querySelector("#passwordLabel").textContent = (accountText[role] || "后台账号") + "密码";
      document.querySelector("#loginUsername").placeholder = accountText[role] || "后台账号";
      document.querySelector("#feishuLoginLink").href = "/api/auth/login?role=" + encodeURIComponent(role);
      document.querySelector(`[data-login-role="${role}"]`)?.setAttribute("aria-current", "page");
      function clearLoginFields() {
        document.querySelector("#loginUsername").value = "";
        document.querySelector("#loginPassword").value = "";
      }
      clearLoginFields();
      setTimeout(clearLoginFields, 100);
      window.addEventListener("pageshow", clearLoginFields);
      ["#loginUsername", "#loginPassword"].forEach((selector) => {
        const input = document.querySelector(selector);
        input.addEventListener("focus", () => input.removeAttribute("readonly"));
        input.addEventListener("click", () => input.removeAttribute("readonly"));
      });
      if (isGithubPages) {
        message.classList.add("is-error");
        message.textContent = "当前是 GitHub Pages 静态展示地址，后台登录需要使用本地或服务器后端地址。";
        document.querySelector(".admin-login-submit").disabled = true;
        document.querySelector("#feishuLoginLink").href = "#";
        document.querySelector("#feishuLoginLink").addEventListener("click", (event) => {
          event.preventDefault();
          message.textContent = "飞书登录也需要后端服务，GitHub Pages 静态页面无法完成身份验证。";
        });
      }
      document.querySelector("#adminLoginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (isGithubPages) return;
        const form = new FormData(event.currentTarget);
        message.classList.remove("is-error");
        message.classList.add("is-success");
        message.textContent = "正在登录…";
        const submitButton = event.currentTarget.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          const response = await fetch("/api/auth/password-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: form.get("loginUsername"), password: form.get("loginPassword"), role, next })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "登录失败");
          location.href = data.next || next;
        } catch (error) {
          message.classList.remove("is-success");
          message.classList.add("is-error");
          message.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
